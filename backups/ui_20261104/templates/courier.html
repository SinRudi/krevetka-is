<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Терминал Курьера — КРЕВЕТКА IS</title>
<style>
body { margin:0; padding:20px 24px; }
.orders-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(330px, 1fr)); gap:16px; }
.order-card { padding:18px; }
</style></head><body>
<div class="page-nav-header">
    <div class="page-nav-left">
        <a href="/" class="btn-back-nav">← Назад в Кассу</a>
        <a href="/map" class="btn-back-nav">Карта зон</a>
        <h1 style="margin:0; font-size:20px; font-weight:800; text-transform:uppercase;">Терминал Курьера ({{ brand_city }})</h1>
    </div>
</div>
<div class="orders-grid" id="orders-container"></div>
<script>
function fetchOrders(){
  fetch('/api/orders?status=ready').then(r=>r.json()).then(ready=>{
    fetch('/api/orders?status=delivering').then(r=>r.json()).then(delivering=>render([...ready,...delivering]));
  });
}
function render(orders){
  const c=document.getElementById('orders-container'); c.innerHTML='';
  if(orders.length===0){ c.innerHTML='<div style="grid-column:1/-1;text-align:center;color:#71717a;padding:60px;font-size:16px;font-weight:600;">Готовых заказов на отправку сейчас нет</div>'; return; }
  orders.forEach(o=>{
    const card=document.createElement('div'); card.className='order-card';
    const items=(o.items||[]).map(i=>`<li>${i.name} × ${i.qty}</li>`).join('');
    const mapQuery = encodeURIComponent(`Республика Коми, Инта, ${o.address || ''}`);
    let changeHtml = (o.payment_method === 'наличные' && o.change_from > 0)
        ? `<div style="background:#121215;border:1px solid #eab308;color:#eab308;padding:7px;border-radius:6px;font-weight:700;text-align:center;margin:8px 0;font-size:12px;">Подготовить сдачу с ${o.change_from} ₽: ${o.change_from - o.total} ₽</div>` : '';
    card.innerHTML=`
      <div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:10px;">
        <span style="font-size:20px;font-weight:800;color:#fafafa;">#${o.id}</span>
        <span class="roll-8-badge">${o.status === 'ready' ? 'ГОТОВ К ОТПРАВКЕ' : 'В ПУТИ'}</span>
      </div>
      <ul style="margin:0 0 12px 0; padding-left:18px; font-size:14px;">${items}</ul>
      <div style="font-size:13px; margin-bottom:12px; display:flex; flex-direction:column; gap:4px;">
        <div>Адрес: <b>${o.address || 'Самовывоз'}</b></div>
        <div>Сумма к оплате: <b style="color:#16a34a; font-size:15px;">${o.total} ₽</b> (${o.payment_method})</div>
      </div>
      ${changeHtml}
      <div style="display:flex; gap:6px; margin-bottom:8px;">
        ${o.phone ? `<a href="tel:${o.phone}" class="quick-chip" style="flex:1;justify-content:center;padding:8px;">Позвонить</a>` : ''}
        <a href="https://yandex.ru/maps/?text=${mapQuery}" target="_blank" class="quick-chip" style="flex:1;justify-content:center;padding:8px;">Маршрут</a>
        <a href="/fiscal/${o.id}" target="_blank" class="quick-chip" style="padding:8px;">Чек</a>
      </div>
      ${o.status==='ready' ? `<button class="btn" style="width:100%;padding:11px;cursor:pointer;" onclick="setStatus(${o.id},'delivering')">Принять и выехать</button>` : ''}
      ${o.status==='delivering' ? `<button class="btn-ready" style="width:100%;padding:11px;border-radius:6px;font-weight:700;cursor:pointer;" onclick="setStatus(${o.id},'done')">Заказ вручён клиенту</button>` : ''}
    `;
    c.appendChild(card);
  });
}
function setStatus(id,status){ fetch('/api/set_status/'+id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})}).then(()=>fetchOrders()); }
setInterval(fetchOrders, 2500); fetchOrders();
</script></body></html>
