<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8">
<title>Техкарта и Редактирование: {{ item.name }}</title>
<style>
body { margin:0; padding:20px 28px; }
.edit-container { max-width: 760px; margin: 0 auto; }
.field { margin-bottom: 12px; }
.field label { display:block; margin-bottom:5px; color:#a1a1aa; font-size:12px; font-weight:600; text-transform:uppercase; }
.field input, .field textarea { width:100%; }
.ing-row { display:flex; align-items:center; gap:10px; margin-bottom:6px; background:#09090b; padding:8px 12px; border-radius:6px; border:1px solid #27272a; }
.ing-row label { flex:1; font-size:13px; font-weight:500; }
</style></head><body>

<div class="edit-container">
    <div class="page-nav-header">
        <div class="page-nav-left">
            <a href="/admin" class="btn-back-nav">← Назад в Управление</a>
            <a href="/" class="btn-back-nav">← В Кассу</a>
            <h1 style="margin:0; font-size:18px; font-weight:800;">Техкарта и параметры: {{ item.name }}</h1>
        </div>
    </div>

    <div class="card-panel" style="padding:22px;">
        {% if item.image %}
        <img src="/static/uploads/{{ item.image }}" style="height:140px; border-radius:8px; object-fit:cover; margin-bottom:14px; border:1px solid #27272a;">
        {% endif %}
        <form method="post" enctype="multipart/form-data">
            <div style="display:grid; grid-template-columns:2fr 1fr 1fr; gap:12px;">
                <div class="field"><label>Наименование</label><input name="name" value="{{ item.name }}" required></div>
                <div class="field"><label>Цена продажи (₽)</label><input name="price" type="number" value="{{ item.price }}" required></div>
                <div class="field"><label>Категория</label><input name="category" value="{{ item.category }}" required></div>
            </div>
            <div style="display:grid; grid-template-columns:1fr 2fr; gap:12px;">
                <div class="field"><label>Приоритет сортировки</label><input name="sort_weight" type="number" value="{{ item.sort_weight or 0 }}"></div>
                <div class="field"><label>Доп. модификаторы</label><input name="modifiers" value="{{ item.modifiers or '' }}"></div>
            </div>
            <div class="field">
                <label>Описание состава (для клиентской витрины)</label>
                <textarea name="composition" rows="2">{{ item.composition or '' }}</textarea>
            </div>

            <h3 style="margin:18px 0 8px 0; font-size:14px; text-transform:uppercase; color:#ff6900;">Технологическая карта (Норма списания со склада на 1 порцию)</h3>
            {% for ing in ingredients %}
            <div class="ing-row">
                <label>{{ ing.name }} <span style="color:#71717a;">(остаток: {{ ing.stock|round(1) }} {{ ing.unit }})</span></label>
                <input type="number" step="any" name="ing_{{ ing.id }}" value="{{ recipe.get(ing.id, '') }}" placeholder="0.00" style="width:110px;">
                <span style="color:#a1a1aa; font-size:12px; width:30px;">{{ ing.unit }}</span>
            </div>
            {% endfor %}

            <div class="field" style="margin-top:16px;">
                <label>Заменить фотографию блюда</label>
                <input type="file" name="image" accept="image/*">
            </div>

            <div style="display:flex; gap:10px; margin-top:18px;">
                <button type="submit" class="btn" style="flex:2; padding:12px; font-size:14px; cursor:pointer;">Сохранить техкарту и изменения</button>
                <a href="/admin" class="btn-back-nav" style="flex:1; justify-content:center;">Отмена</a>
            </div>
        </form>
    </div>
</div>
</body></html>
