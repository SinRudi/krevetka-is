<!DOCTYPE html><html lang="ru"><head><meta name="csrf-token" content="{{ csrf_token() }}"><script src="/static/security.js"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Отслеживание заказа — Креветка</title>
<style>
body{font-family:-apple-system,sans-serif;background:#0a0a0a;color:#fff;margin:0;display:flex;align-items:center;justify-content:center;height:100vh}
.box{background:#151515;padding:40px;border-radius:20px;text-align:center;border:1px solid #333;max-width:400px;width:90%}
h1{color:#ff7a00;margin-top:0}
.status-badge{display:inline-block; padding:10px 20px; border-radius:20px; font-weight:bold; font-size:18px; margin:20px 0; background:#333;}
.step{margin:15px 0; padding:15px; border-radius:10px; background:#1a1a1a; border-left:4px solid #333; text-align:left; opacity:0.5; transition:0.3s;}
.step.active{opacity:1; border-left-color:#ff7a00; background:#2a1f10;}
.step.done{opacity:1; border-left-color:#30d158; color:#888;}
</style><link rel="stylesheet" href="/static/pro_style.css">
</head><body>
<div class="box">
    <h1>Заказ #<span id="order-id">{{ order_id }}</span></h1>
    <p style="color:#888">Мы готовим его для вас!</p>
    
    <div class="status-badge" id="main-status">Загрузка...</div>
    
    <div id="steps">
        <div class="step" id="step-new">🟡 <b>Заказ принят</b><br>Ожидает подтверждения</div>
        <div class="step" id="step-cooking">🟠 <b>Готовится</b><br>Повара уже приступили</div>
        <div class="step" id="step-ready">🟢 <b>Готов</b><br>Ожидает курьера</div>
        <div class="step" id="step-delivering">🛵 <b>В пути</b><br>Курьер уже едет к вам</div>
        <div class="step" id="step-done">✅ <b>Доставлен</b><br>Приятного аппетита!</div>
    </div>
</div>
<script>
const orderId = {{ order_id }};
const orderToken = {{ token|tojson }};
let lastStatus = null;

// Запрос разрешения на Push-уведомления
if ("Notification" in window) {
    Notification.requestPermission();
}

function updateStatus(){
    fetch('/api/track_order/' + orderId + '?t=' + encodeURIComponent(orderToken)).then(r=>r.json()).then(data=>{
        if(data.error) return;
        const st = data.status;
        
        // Логика уведомлений
        if (lastStatus && lastStatus !== st) {
            if (st === 'delivering' && Notification.permission === 'granted') {
                new Notification("🛵 Ваш заказ в пути!", { body: "Курьер уже едет к вам. Ожидайте!" });
            }
            if (st === 'done' && Notification.permission === 'granted') {
                new Notification("✅ Заказ доставлен!", { body: "Приятного аппетита!" });
            }
        }
        lastStatus = st;

        const badge = document.getElementById('main-status');
        const labels = {new:'🟡 Принят', cooking:'🟠 Готовится', ready:'🟢 Готов', delivering:'🛵 В пути', done:'✅ Доставлен'};
        badge.innerText = labels[st] || st;
        
        document.querySelectorAll('.step').forEach(s => s.classList.remove('active', 'done'));
        
        if(st === 'new') document.getElementById('step-new').classList.add('active');
        if(st === 'cooking') { document.getElementById('step-new').classList.add('done'); document.getElementById('step-cooking').classList.add('active'); }
        if(st === 'ready') { ['new','cooking'].forEach(k => document.getElementById('step-'+k).classList.add('done')); document.getElementById('step-ready').classList.add('active'); }
        if(st === 'delivering') { ['new','cooking','ready'].forEach(k => document.getElementById('step-'+k).classList.add('done')); document.getElementById('step-delivering').classList.add('active'); }
        if(st === 'done') { ['new','cooking','ready','delivering'].forEach(k => document.getElementById('step-'+k).classList.add('done')); document.getElementById('step-done').classList.add('active'); }
    });
}
setInterval(updateStatus, 3000);
updateStatus();
</script>
</body></html>
